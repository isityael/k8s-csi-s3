when:
  - event: pull_request
  - event: push
    branch: isityael/dhi-hardening
  - event: tag
    ref: refs/tags/v*-ym*
  - event: manual

services:
  docker:
    image: docker:29.8.1-dind@sha256:76cd6bbc3ab600fced21a7e1bea77ac00cb7c545eb95d5767e4ec4ffbcb242dc
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""

steps:
  - name: privileged-csi-suite
    image: docker:29.8.1-cli@sha256:1b0a4c8c69b84185904584e05e5d3b6e6b5f01d1339dcfbe1cd7dfa5d5ac7543
    environment:
      DOCKER_HOST: tcp://docker:2375
    commands:
      - apk add --no-cache make
      - until docker info >/dev/null 2>&1; do sleep 1; done
      - make test
