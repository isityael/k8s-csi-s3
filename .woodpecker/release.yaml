when:
  - event: tag
    ref: refs/tags/v*-yael.*

depends_on:
  - validate

steps:
  - name: build-candidate
    image: woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    privileged: true
    settings:
      registry: git.m0sh1.cc
      repo: git.m0sh1.cc/isityael/csi-s3-driver
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
      tags:
        - candidate-${CI_COMMIT_SHA}
      build_args:
        IMAGE_VERSION: "${CI_COMMIT_TAG}"
        VCS_REF: "${CI_COMMIT_SHA}"
      logins:
        - registry: git.m0sh1.cc
          username:
            from_secret: forgejo_public_package_username
          password:
            from_secret: forgejo_public_package_token
        - registry: dhi.io
          username:
            from_secret: dhi_username
          password:
            from_secret: dhi_password
      provenance: mode=max
      cache_from: 'type=registry\,ref=git.m0sh1.cc/isityael/csi-s3-driver:buildcache'
      cache_to: 'type=registry,ref=git.m0sh1.cc/isityael/csi-s3-driver:buildcache,mode=max,ignore-error=true'

  - name: scan-candidate
    image: dhi.io/trivy:0.74.0-alpine3.24-dev@sha256:c54ed1ca6ed018ca962d95c606458f1540746ac016b98f2f33c1be794ad38b4d
    environment:
      TRIVY_USERNAME:
        from_secret: forgejo_public_package_username
      TRIVY_PASSWORD:
        from_secret: forgejo_public_package_token
    commands:
      - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "git.m0sh1.cc/isityael/csi-s3-driver:candidate-$${CI_COMMIT_SHA}"

  - name: sign-candidate
    image: dhi.io/cosign:3.1.4-alpine3.24-dev@sha256:7572c01000040cf5e7118a25580cff348e1375b3fdbbb0e78eddfa97cd6196ba
    environment:
      COSIGN_EXPERIMENTAL: "1"
      COSIGN_KEY:
        from_secret: cosign_key
      COSIGN_PASSWORD:
        from_secret: cosign_password
      REGISTRY_USERNAME:
        from_secret: forgejo_public_package_username
      REGISTRY_PASSWORD:
        from_secret: forgejo_public_package_token
    commands:
      - printf '%s' "$${COSIGN_KEY}" > /tmp/cosign.key
      - cosign login git.m0sh1.cc -u "$${REGISTRY_USERNAME}" -p "$${REGISTRY_PASSWORD}"
      - cosign public-key --key /tmp/cosign.key > /tmp/cosign.pub
      - candidate="git.m0sh1.cc/isityael/csi-s3-driver:candidate-$${CI_COMMIT_SHA}"
      - cosign sign --key /tmp/cosign.key --yes --registry-referrers-mode=oci-1-1 "$${candidate}"
      - cosign verify --key /tmp/cosign.pub --experimental-oci11 "$${candidate}"
      - rm -f /tmp/cosign.key /tmp/cosign.pub

  - name: promote-release
    image: dhi.io/crane:0.22.1-debian13-dev@sha256:82b1dc28811889cba5bcab21f599349347944a11faee62dcd5cfc43b16d28838
    environment:
      GHCR_USERNAME:
        from_secret: forgejo_public_package_username
      GHCR_TOKEN:
        from_secret: forgejo_public_package_token
    commands:
      - printf '%s' "$${GHCR_TOKEN}" | crane auth login git.m0sh1.cc -u "$${GHCR_USERNAME}" --password-stdin
      - candidate="git.m0sh1.cc/isityael/csi-s3-driver:candidate-$${CI_COMMIT_SHA}"
      - release="git.m0sh1.cc/isityael/csi-s3-driver:$${CI_COMMIT_TAG}"
      - version="git.m0sh1.cc/isityael/csi-s3-driver:$${CI_COMMIT_TAG#v}"
      - crane copy "$${candidate}" "$${release}"
      - crane copy "$${candidate}" "$${version}"
