when:
  - event: pull_request
  - event: push
    branch: isityael/dhi-hardening
  - event: tag
    ref: refs/tags/v*-ym*
  - event: manual

services:
  docker:
    image: docker:29.7.1-dind@sha256:e8faad5a8dc5279dff929afc5449f2791736912fff9f99351d742db2fad01b4c
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""

steps:
  - name: privileged-csi-suite
    image: docker:29.7.1-cli@sha256:8e7f8c848f46647a532833619f894480f54cd20c0057e1b552d8b46bf3efddb7
    environment:
      DOCKER_HOST: tcp://docker:2375
    commands:
      - apk add --no-cache make
      - until docker info >/dev/null 2>&1; do sleep 1; done
      - make test
