when:
  - event: pull_request
  - event: push
    branch: isityael/dhi-hardening
  - event: tag
    ref: refs/tags/v*-ym*
  - event: manual

services:
  docker:
    image: docker:29.7.1-dind@sha256:dab286577468bcb55d834faea4fe7b3bef5a4f10aaf9927305971761b9ba9e20
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""

steps:
  - name: privileged-csi-suite
    image: docker:29.7.1-cli@sha256:8e7f8c848f46647a532833619f894480f54cd20c0057e1b552d8b46bf3efddb7
    environment:
      DOCKER_HOST: tcp://docker:2375
    commands:
      - apk add --no-cache make
      - until docker info >/dev/null 2>&1; do sleep 1; done
      - make test
