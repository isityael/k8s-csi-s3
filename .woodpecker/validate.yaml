when:
  - event: pull_request
  - event: push
    branch: isityael/dhi-hardening
  - event: tag
    ref: refs/tags/v*-ym*
  - event: manual

services:
  docker:
    image: docker:29.7.2-dind@sha256:3ef33f2e220b79ed3ef3b99d81746f06f306cd6340e2cb7331d17ae996e74cb6
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""

steps:
  - name: privileged-csi-suite
    image: docker:29.7.2-cli@sha256:eb952fbf036947347bff9f303878c86ec3df00af0341f4cca59b1d1924d6668d
    environment:
      DOCKER_HOST: tcp://docker:2375
    commands:
      - apk add --no-cache make
      - until docker info >/dev/null 2>&1; do sleep 1; done
      - make test
