name: Validate downstream fork

on:
  pull_request:
  push:
    branches:
      - isityael/dhi-hardening
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify downstream policy
        run: .ci/test-downstream-policy.sh

      - name: Verify formatting
        run: test -z "$(gofmt -l cmd pkg)"

      - name: Verify modules
        run: go mod verify

      - name: Vet packages
        run: go vet ./...

      - name: Compile all tests
        run: go test ./... -run '^$'
