when:
  - event: pull_request
  - event: push
    branch: isityael/dhi-hardening
  - event: tag
    ref: refs/tags/v*-yael.*
  - event: manual

services:
  docker:
    image: docker:29.9.1-dind@sha256:3e5756e2b6dad6a5f1f5deacf0a19f9eaa2581b76ae092b2d4a118162e1d4d4e
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""

steps:
  - name: privileged-csi-suite
    image: docker:29.9.1-cli@sha256:6fae2214c3121a28d5aa639d09032f61310b7c9c75ffbad1025f261a1b621800
    environment:
      DOCKER_HOST: tcp://docker:2375
      # The test image copies MinIO from dhi.io.
      DHI_USERNAME:
        from_secret: dhi_username
      DHI_PASSWORD:
        from_secret: dhi_password
    # This step is only the docker CLI driving the dind service, which does the
    # actual build and test. Without explicit resources it inherits the 4Gi
    # LimitRange default, doubling this workflow's claim on the 32Gi namespace
    # quota; under Renovate bursts that got the pod rejected outright
    # ("exceeded quota: woodpecker-quota"), failing tag pipeline 153.
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
    commands:
      - apk add --no-cache make
      - until docker info >/dev/null 2>&1; do sleep 1; done
      - printf '%s' "$${DHI_PASSWORD}" | docker login dhi.io -u "$${DHI_USERNAME}" --password-stdin
      - make test
