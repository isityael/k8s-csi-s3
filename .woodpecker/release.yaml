when:
  - event: tag
    ref: refs/tags/v*-ym*

depends_on:
  - validate

steps:
  - name: build-candidate
    image: woodpeckerci/plugin-docker-buildx:6.1.1@sha256:9a22c00b4952e405d11e66d29772edbeb1f7b24f27f71cda251ecb838e725e86
    privileged: true
    settings:
      registry: ghcr.io
      repo: ghcr.io/isityael/csi-s3-driver
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
      tags:
        - candidate-${CI_COMMIT_SHA}
      build_args:
        IMAGE_VERSION: "${CI_COMMIT_TAG}"
        VCS_REF: "${CI_COMMIT_SHA}"
      logins:
        - registry: ghcr.io
          username:
            from_secret: github_username
          password:
            from_secret: github_token
        - registry: dhi.io
          username:
            from_secret: dhi_username
          password:
            from_secret: dhi_password
      provenance: mode=max
      cache_from: 'type=registry\,ref=ghcr.io/isityael/csi-s3-driver:buildcache'
      cache_to: 'type=registry,ref=ghcr.io/isityael/csi-s3-driver:buildcache,mode=max,ignore-error=true'

  - name: scan-candidate
    image: dhi.io/trivy:0.71.2-alpine3.24-dev@sha256:111c2d07f6a936c6429f5bb551899cdd662917b754ae5effcdd45c447cb5b5ab
    environment:
      TRIVY_USERNAME:
        from_secret: github_username
      TRIVY_PASSWORD:
        from_secret: github_token
    commands:
      - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "ghcr.io/isityael/csi-s3-driver:candidate-$${CI_COMMIT_SHA}"

  - name: sign-candidate
    image: dhi.io/cosign:3.1.2-alpine3.24-dev@sha256:9698ed2b29667b7ee83b585959aaf87c9fd21a2a46f1a856b214ff51fd11937c
    environment:
      COSIGN_EXPERIMENTAL: "1"
      COSIGN_KEY:
        from_secret: cosign_key
      COSIGN_PASSWORD:
        from_secret: cosign_password
      REGISTRY_USERNAME:
        from_secret: github_username
      REGISTRY_PASSWORD:
        from_secret: github_token
    commands:
      - printf '%s' "$${COSIGN_KEY}" > /tmp/cosign.key
      - cosign login ghcr.io -u "$${REGISTRY_USERNAME}" -p "$${REGISTRY_PASSWORD}"
      - cosign public-key --key /tmp/cosign.key > /tmp/cosign.pub
      - candidate="ghcr.io/isityael/csi-s3-driver:candidate-$${CI_COMMIT_SHA}"
      - cosign sign --key /tmp/cosign.key --yes --registry-referrers-mode=oci-1-1 "$${candidate}"
      - cosign verify --key /tmp/cosign.pub --experimental-oci11 "$${candidate}"
      - rm -f /tmp/cosign.key /tmp/cosign.pub

  - name: promote-release
    image: dhi.io/crane:0.21.7-debian13-dev@sha256:5c8e6a602d0c668812c6645de88af5b1d69c1a1faa4b05facecd6678371f38b7
    environment:
      GHCR_USERNAME:
        from_secret: github_username
      GHCR_TOKEN:
        from_secret: github_token
    commands:
      - printf '%s' "$${GHCR_TOKEN}" | crane auth login ghcr.io -u "$${GHCR_USERNAME}" --password-stdin
      - candidate="ghcr.io/isityael/csi-s3-driver:candidate-$${CI_COMMIT_SHA}"
      - release="ghcr.io/isityael/csi-s3-driver:$${CI_COMMIT_TAG}"
      - version="ghcr.io/isityael/csi-s3-driver:$${CI_COMMIT_TAG#v}"
      - crane copy "$${candidate}" "$${release}"
      - crane copy "$${candidate}" "$${version}"
