name: Validate downstream fork

on:
  pull_request:
  push:
    branches:
      - isityael/dhi-hardening
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify downstream policy
        run: .ci/test-downstream-policy.sh

      - name: Verify formatting
        run: test -z "$(gofmt -l cmd pkg)"

      - name: Verify modules
        run: go mod verify

      - name: Vet packages
        run: go vet ./...

      - name: Compile all tests
        run: go test ./... -run '^$'
